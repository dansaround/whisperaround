name: Preview build (PR)

# Builds an installer from a pull request so it can be tried before merging.
# Runs untrusted PR code, so it gets a read-only token, no secrets and no
# release: the installer is only uploaded as a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Updater artifacts need the signing key, which this job must not have.
      - name: Build installer
        shell: bash
        run: pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whisperaround-pr-${{ inputs.pr }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
