name: Build (Windows)

# Builds the Windows installer/.exe on a native runner, avoiding cross-toolchain
# setup inside WSL2. Triggers on version tags and manual dispatch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # tauri-action creates the GitHub release, which needs write access to repo
    # contents (the default GITHUB_TOKEN is read-only otherwise). The id-token /
    # attestations scopes sign the build-provenance attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          # No pnpm / cargo cache here: a cache another workflow could have
          # written must not reach the job that holds the signing key.

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build app (Tauri)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; the app only installs updates whose
          # signature matches the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WhisperAround ${{ github.ref_name }}"
          releaseBody: "Descarga `WhisperAround_*_x64-setup.exe` e instálalo. Guía y notas de seguridad en el [README](https://github.com/dansaround/whisperaround#readme)."
          # Published right away: `releases/latest` (README link + updater
          # feed) only sees non-draft releases.
          releaseDraft: false
          prerelease: false

      # Lets anyone check an installer was built here from this tag:
      #   gh attestation verify <file> -R dansaround/whisperaround
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Opens the winget-pkgs PR for the new version. Needs a classic PAT with
  # `public_repo` saved as the WINGET_TOKEN secret; skipped without it. Runs
  # apart from the build, without repo permissions, so the third-party action
  # never shares a job with the release assets or the signing key.
  winget:
    needs: build
    runs-on: windows-latest
    permissions: {}
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Publish to winget
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # main
        with:
          identifier: dansaround.WhisperAround
          installers-regex: '_x64-setup\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
